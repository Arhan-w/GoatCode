<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Goated AI</title>
  <style>
    :root {
      --accent: #5e6ad2;
      --bg-dark: #0a0c17;
      --bg-darker: #060812;
      --text: #e0e0ff;
    }
    body {
      margin: 0;
      overflow: hidden;
      background: var(--bg-dark);
      font-family: 'Inter', sans-serif;
      color: var(--text);
    }
    #hud {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: -1;
    }
    #chat-container {
      position: relative;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    #messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }
    #input-area {
      padding: 15px;
      border-top: 1px solid rgba(94, 106, 210, 0.2);
    }
  </style>
</head>
<body>
  <div id="hud"></div>
  <div id="chat-container">
    <div id="messages"></div>
    <div id="input-area">
      <input type="text" id="user-input" placeholder="Ask Goated..." style="width:100%; background:var(--bg-darker); color:var(--text); border:1px solid var(--accent); padding:8px; border-radius:4px;">
    </div>
  </div>
  <script src="vendor/three.min.js"></script>
  <script>
    // Arc Reactor core with orbital rings (Jarvis trope)
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById('hud').appendChild(renderer.domElement);

    // Core reactor sphere
    const coreGeometry = new THREE.SphereGeometry(0.5, 32, 32);
    const coreMaterial = new THREE.MeshBasicMaterial({ color: 0x5e6ad2, transparent: true, opacity: 0.8 });
    const core = new THREE.Mesh(coreGeometry, coreMaterial);
    scene.add(core);

    // Orbital rings (2 at different angles)
    for (let i = 0; i < 2; i++) {
      const ring = new THREE.Mesh(
        new THREE.TorusGeometry(1 + i*0.3, 0.02, 16, 100),
        new THREE.MeshBasicMaterial({ color: 0x5e6ad2, transparent: true, opacity: 0.3 })
      );
      ring.rotation.x = i * Math.PI/4;
      scene.add(ring);
      ring.userData.speed = 0.005 + i*0.002;
    }

    camera.position.z = 5;

    function animate() {
      requestAnimationFrame(animate);
      core.rotation.x += 0.005;
      core.rotation.y += 0.005;
      
      scene.children.forEach(child => {
        if (child.userData.speed) {
          child.rotation.y += child.userData.speed;
        }
      });
      
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
